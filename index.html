<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<script>
'use strict';
/* Penyimpanan data di browser (IndexedDB). GitHub Pages hanya hosting statis,
   jadi seluruh data tersimpan di peramban yang dipakai. */
const STORES = ['pegawai', 'presensi', 'perizinan', 'users', 'pengaturan'];

const PENGATURAN_DEFAULT = {
    nama_sekolah: 'Sekolah Kita', jam_masuk_standar: '07:30', toleransi_menit: '15',
    sekolah_lat: '', sekolah_lng: '', radius_meter: '0',
    nama_kepala_sekolah: '', nip_kepala_sekolah: '', kota: ''
};

const DB = {
    _db: null,
    open() {
        return new Promise((res, rej) => {
            const rq = indexedDB.open('presensi-sekolah', 1);
            rq.onupgradeneeded = () => {
                const d = rq.result;
                STORES.forEach(s => {
                    if (s === 'pengaturan') d.createObjectStore(s, { keyPath: 'kunci' });
                    else d.createObjectStore(s, { keyPath: 'id', autoIncrement: true });
                });
            };
            rq.onsuccess = () => { this._db = rq.result; res(); };
            rq.onerror = () => rej(rq.error);
        });
    },
    _tx(s, mode, fn) {
        return new Promise((res, rej) => {
            const t = this._db.transaction(s, mode);
            const r = fn(t.objectStore(s));
            t.oncomplete = () => res(r && r.result);
            t.onerror = () => rej(t.error);
            t.onabort = () => rej(t.error);
        });
    },
    all(s) { return this._tx(s, 'readonly', st => st.getAll()); },
    get(s, id) { return this._tx(s, 'readonly', st => st.get(id)); },
    put(s, o) { return this._tx(s, 'readwrite', st => st.put(o)); },   // mengembalikan id
    del(s, id) { return this._tx(s, 'readwrite', st => st.delete(id)); },
    clear(s) { return this._tx(s, 'readwrite', st => st.clear()); },

    async pengaturan() {
        const rows = await this.all('pengaturan');
        const h = Object.assign({}, PENGATURAN_DEFAULT);
        rows.forEach(r => h[r.kunci] = r.nilai);
        return h;
    },
    async simpanPengaturan(obj) {
        for (const k of Object.keys(obj)) await this.put('pengaturan', { kunci: k, nilai: String(obj[k]) });
    }
};

async function hashPassword(pw, salt) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pw));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function acakSalt() { return Array.from(crypto.getRandomValues(new Uint8Array(8))).map(b => b.toString(16).padStart(2, '0')).join(''); }
async function buatUser(username, password, nama_lengkap, role) {
    const salt = acakSalt();
    return { username, salt, hash: await hashPassword(password, salt), nama_lengkap, role, created_at: nowStr() };
}
function nowStr() { const d = new Date(); return isoTgl(d) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ':' + String(d.getSeconds()).padStart(2, '0'); }
function isoTgl(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

async function seedAwal() {
    const users = await DB.all('users');
    if (!users.length) {
        await DB.put('users', await buatUser('admin', 'admin123', 'Administrator', 'admin'));
        await DB.put('users', await buatUser('kepsek', 'kepsek123', 'Kepala Sekolah', 'kepala_sekolah'));
    }
    if (!(await DB.all('pengaturan')).length) await DB.simpanPengaturan(PENGATURAN_DEFAULT);
    if (!(await DB.all('pegawai')).length) {
        const contoh = [['Siti Aminah', 'guru', 'Guru Kelas 1', '1111'], ['Budi Santoso', 'guru', 'Guru Kelas 2', '2222'],
            ['Rina Wulandari', 'guru', 'Guru Mata Pelajaran', '3333'], ['Agus Prasetyo', 'staf', 'Staf Tata Usaha', '4444'],
            ['Dewi Kartika', 'staf', 'Staf Kebersihan', '5555']];
        for (const [nama, jenis, jabatan, pin] of contoh)
            await DB.put('pegawai', { nama, nip: null, jenis, jabatan, pin, status: 'aktif', created_at: nowStr() });
    }
}

</script>
<script>
'use strict';
/* Presensi Guru & Staf — versi statis untuk GitHub Pages (data di IndexedDB browser). */

const STATUS_LABEL = { hadir: 'Hadir', terlambat: 'Terlambat', sakit: 'Sakit', izin: 'Izin', alpa: 'Alpa' };
const STATUS_BADGE = { hadir: 'success', terlambat: 'warning', sakit: 'info', izin: 'primary', alpa: 'danger' };
const NAMA_BULAN = ['', 'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const NAMA_HARI_MULAI_SENIN = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];
const NAMA_HARI_MULAI_MINGGU = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const kode = p => (p.jenis === 'guru' ? 'G' : 'S') + String(p.id).padStart(3, '0');
const hariIni = () => isoTgl(new Date());
const dowSenin = d => (d.getDay() + 6) % 7;            // 0 = Senin
const parseTgl = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const tglIndo = s => { try { const d = parseTgl(s); return `${NAMA_HARI_MULAI_SENIN[dowSenin(d)]}, ${d.getDate()} ${NAMA_BULAN[d.getMonth() + 1]} ${d.getFullYear()}`; } catch (e) { return s; } };
const potong = (t, n) => t && t.length > n ? t.slice(0, n) + '…' : (t || '');
const urlPeta = (lat, lng) => `https://www.google.com/maps?q=${lat},${lng}`;

// ---------- sesi & pesan ----------
const Sesi = {
    get() { try { return JSON.parse(sessionStorage.getItem('sesi') || 'null'); } catch (e) { return null; } },
    set(o) { sessionStorage.setItem('sesi', JSON.stringify(o)); },
    clear() { sessionStorage.removeItem('sesi'); }
};
let pesanTertunda = [];
function flash(teks, kat) { pesanTertunda.push({ teks, kat: kat || 'info' }); }
function htmlFlash(dismiss) {
    const h = pesanTertunda.map(p => `<div class="alert alert-${p.kat} ${dismiss ? 'alert-dismissible fade show' : 'text-center fw-medium shadow-sm'}" role="alert">${esc(p.teks)}${dismiss ? '<button type="button" class="btn-close" data-bs-dismiss="alert"></button>' : ''}</div>`).join('');

function tampilModal(judul, isi, opsi) {
    opsi = opsi || {};
    const host = $('#modalHost');
    host.innerHTML = `<div class="modal fade" tabindex="-1"><div class="modal-dialog ${opsi.lebar || ''}"><div class="modal-content">
        <form id="modalForm"><div class="modal-header"><h6 class="modal-title fw-bold mb-0">${judul}</h6><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">${isi}</div>
        ${opsi.ok === false ? '' : `<div class="modal-footer"><button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Batal</button><button type="submit" class="btn ${opsi.danger ? 'btn-danger' : 'btn-brand'} btn-sm">${opsi.ok || 'Simpan'}</button></div>`}
        </form></div></div></div>`;
    const el = host.firstElementChild;
    const m = new bootstrap.Modal(el);
    el.addEventListener('hidden.bs.modal', () => { host.innerHTML = ''; });
    $('#modalForm', el).addEventListener('submit', async ev => {
        ev.preventDefault();
        if (!opsi.onOk) { m.hide(); return; }
        const hasil = await opsi.onOk(new FormData(ev.target));
        if (hasil !== false) m.hide();
    });
    m.show();
    return m;
}

function parseHash() {
    const h = location.hash.replace(/^#/, '') || '/';
    const [path, qs] = h.split('?');
    rutePar = Object.fromEntries(new URLSearchParams(qs || ''));
    return path || '/';
}
function nav(path, par) {
    const qs = par ? '?' + new URLSearchParams(Object.entries(par).filter(([, v]) => v !== '' && v != null)).toString() : '';
    const baru = '#' + path + (qs === '?' ? '' : qs);
    if (location.hash === baru) render(); else location.hash = baru;
}

async function render() {

        if (!s) { flash('Silakan login terlebih dahulu.', 'warning'); return nav('/login'); }

        if (r.admin && s.role !== 'admin') { flash('Halaman ini hanya dapat diakses oleh Administrator.', 'danger'); return nav('/admin'); }

const FaceRec = {
    modelLoaded: false,
    loading: false,
    modelUrls: [
        'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights',
        'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights'
    ],
    async init() {
        if (this.modelLoaded) return true;
        if (this.loading) {
            while (this.loading) await new Promise(r => setTimeout(r, 100));
            return this.modelLoaded;
        }
        this.loading = true;
        if (typeof faceapi === 'undefined') {
            console.error('Pustaka face-api.js belum termuat.');
            this.loading = false;
            return false;
        }
        for (const url of this.modelUrls) {
            try {
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(url),
                    faceapi.nets.faceLandmark68Net.loadFromUri(url),
                    faceapi.nets.faceRecognitionNet.loadFromUri(url)
                ]);
                this.modelLoaded = true;
                break;
            } catch (e) {
                console.warn('Gagal memuat model dari:', url, e);
            }
        }
        this.loading = false;
        return this.modelLoaded;
    },
    buildMatcher(daftar) {
        if (!window.faceapi) return null;
        const labeled = [];
        for (const p of daftar) {
            if (p.face_descriptor && Array.isArray(p.face_descriptor) && p.face_descriptor.length === 128) {
                labeled.push(new faceapi.LabeledFaceDescriptors(String(p.id), [new Float32Array(p.face_descriptor)]));
            }
        }
        if (!labeled.length) return null;
        return new faceapi.FaceMatcher(labeled, 0.52);
    },
    async detectSingle(videoEl) {
        if (!this.modelLoaded || !videoEl || !videoEl.videoWidth || videoEl.paused || videoEl.ended) return null;
        try {
            const opt = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.5 });
            return await faceapi.detectSingleFace(videoEl, opt).withFaceLandmarks().withFaceDescriptor();
        } catch (e) {
            return null;
        }
    },
    async extractFromMedia(el) {
        if (!this.modelLoaded) await this.init();
        if (!this.modelLoaded) return null;
        try {
            const opt = new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.45 });
            return await faceapi.detectSingleFace(el, opt).withFaceLandmarks().withFaceDescriptor();
        } catch (e) {
            console.error(e);
            return null;
        }
    }
};

function bunyikanSukses() {
    try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (ctx.state === 'suspended') ctx.resume();
        const o1 = ctx.createOscillator();
        const g1 = ctx.createGain();
        o1.type = 'sine';
        o1.frequency.setValueAtTime(523.25, ctx.currentTime);
        o1.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
        o1.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
        g1.gain.setValueAtTime(0.25, ctx.currentTime);
        g1.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
        o1.connect(g1);
        g1.connect(ctx.destination);
        o1.start();
        o1.stop(ctx.currentTime + 0.45);
    } catch (e) {}
}

function buatFotoGeotag(v, peg, aksi) {
    if (!v || !v.videoWidth) return null;
    const skala = Math.min(1, 960 / v.videoWidth), c = document.createElement('canvas');
    c.width = Math.round(v.videoWidth * skala); c.height = Math.round(v.videoHeight * skala);
    const ctx = c.getContext('2d');
    ctx.translate(c.width, 0); ctx.scale(-1, 1);
    ctx.drawImage(v, 0, 0, c.width, c.height);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    
    const n = new Date();
    const tgl = `${n.getDate()} ${NAMA_BULAN[n.getMonth() + 1]} ${n.getFullYear()} ` + [n.getHours(), n.getMinutes(), n.getSeconds()].map(x => String(x).padStart(2, '0')).join(':');
    const koor = K.lat !== null ? `${K.lat.toFixed(6)}, ${K.lng.toFixed(6)}` : 'Lokasi tidak tersedia';
    const geotag = `${peg.nama} | ${aksi === 'pulang' ? 'Pulang' : 'Masuk'} (Wajah) | ${tgl} | ${koor}`;

    const u = Math.max(13, Math.round(c.width / 48)), pad = Math.round(u * 0.6);
    ctx.font = `600 ${u}px Arial, sans-serif`;
    const baris = bungkus(ctx, geotag, c.width - pad * 2);
    if (K.alamat) bungkus(ctx, K.alamat, c.width - pad * 2).slice(0, 2).forEach(b => baris.push(b));
    const tinggi = baris.length * u * 1.3 + pad * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0, c.height - tinggi, c.width, tinggi);
    ctx.fillStyle = '#fff'; ctx.textBaseline = 'top';
    baris.forEach((b, i) => ctx.fillText(b, pad, c.height - tinggi + pad + i * u * 1.3));
    return c.toDataURL('image/jpeg', 0.82);
}

function setLok(teks, kartu) { const a = $('#lokTeks'), b = $('#lokKartuTeks'); if (a) a.textContent = teks; if (b) b.textContent = kartu || teks; }
function ambilLokasi() {
    K.lat = K.lng = K.alamat = null;
    if (!('geolocation' in navigator)) { setLok('Perangkat tidak mendukung lokasi', 'lokasi tidak tersedia'); $('#lokStrip').classList.add('err'); return; }
    navigator.geolocation.getCurrentPosition(pos => {
        K.lat = pos.coords.latitude; K.lng = pos.coords.longitude;
        setLok(`Lokasi terdeteksi (±${Math.round(pos.coords.accuracy)} m)`, `GPS: ${K.lat.toFixed(5)}, ${K.lng.toFixed(5)}`);
        $('#lokStrip') && $('#lokStrip').classList.remove('err');
        fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${K.lat}&lon=${K.lng}&zoom=18`)
            .then(r => r.ok ? r.json() : null).then(d => { if (d && d.display_name) { K.alamat = d.display_name; setLok(K.alamat, K.alamat); } }).catch(() => {});
    }, () => { setLok('Izin lokasi ditolak', 'lokasi tidak diizinkan'); const s = $('#lokStrip'); s && s.classList.add('err'); }, { enableHighAccuracy: true, timeout: 10000 });
}

function renderPin() { $$('#pinDots .pin-dot').forEach((d, i) => d.classList.toggle('terisi', i < K.pin.length)); }
async function statusHariIni(pid) {
    const rec = (await DB.all('presensi')).find(r => r.pegawai_id === pid && r.tanggal === hariIni());
    return rec || null;
}
function jarakMeter(a1, o1, a2, o2) {
    const R = 6371000, r = x => x * Math.PI / 180, dp = r(a2 - a1), dl = r(o2 - o1);
    const a = Math.sin(dp / 2) ** 2 + Math.cos(r(a1)) * Math.cos(r(a2)) * Math.sin(dl / 2) ** 2;
    return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
function batasTerlambat(jam, tol) { const [h, m] = jam.split(':').map(Number); const t = h * 60 + m + Number(tol); return t; }

    const koor = K.lat !== null ? `${K.lat.toFixed(6)}, ${K.lng.toFixed(6)}` : 'Lokasi tidak tersedia';
    return `${K.pegawai.nama} | ${K.aksi === 'pulang' ? 'Pulang' : 'Masuk'} | ${tgl} | ${koor}`;
}

function bungkus(ctx, teks, lebar) {
    const baris = []; let cur = '';
    teks.split(' ').forEach(w => { const u = cur ? cur + ' ' + w : w; if (ctx.measureText(u).width > lebar && cur) { baris.push(cur); cur = w; } else cur = u; });
    if (cur) baris.push(cur); return baris;
}

    const pill = $('#statusWajah');
    const v = $('#videoWajah');

    if (pill) pill.innerHTML = '<div class="spinner-border spinner-border-sm text-light me-1" style="width:0.85rem;height:0.85rem;"></div> Memuat model AI wajah...';

        return;
    }

    try {
        const s = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: { ideal: 960 }, height: { ideal: 720 } },

async function loopScanWajah() {
    if (!K.faceLoopActive || K.isProcessingPresensi) return;
    const v = $('#videoWajah');
    const c = $('#canvasWajah');
    const pill = $('#statusWajah');
    const target = $('#targetWajah');
    
    if (!v || v.paused || v.ended) {
        if (K.faceLoopActive) setTimeout(loopScanWajah, 150);
        return;
    }
    
    if (v.readyState < 2 || !v.videoWidth) {
        if (K.faceLoopActive) setTimeout(loopScanWajah, 120);
        return;
    }
    
    if (c && (c.width !== v.clientWidth || c.height !== v.clientHeight)) {
        c.width = v.clientWidth;
        c.height = v.clientHeight;
    }
    
    const detection = await FaceRec.detectSingle(v);
    
    if (!K.faceLoopActive || K.isProcessingPresensi) return;
    
    const ctx = c ? c.getContext('2d') : null;
    if (ctx) ctx.clearRect(0, 0, c.width, c.height);
    
    if (!detection) {
        if (target) { target.classList.remove('matched'); target.classList.remove('detecting'); }
        if (pill) pill.innerHTML = '<i class="bi bi-camera me-1"></i> Posisikan wajah di dalam bingkai';
        K.lastMatch = { id: null, count: 0, ts: 0 };
        resetCardHasilWajah();
        if (K.faceLoopActive) setTimeout(loopScanWajah, 80);
        return;
    }
    
    // Face detected
    const scaleX = c.width / v.videoWidth;
    const scaleY = c.height / v.videoHeight;
    const box = detection.detection.box;
    const bw = box.width * scaleX;
    const bh = box.height * scaleY;
    const bx = c.width - (box.x * scaleX + bw);
    const by = box.y * scaleY;
    
    if (!K.faceMatcher) {
        if (target) { target.classList.add('detecting'); target.classList.remove('matched'); }
        if (ctx) {
            ctx.strokeStyle = '#ffc107'; ctx.lineWidth = 2; ctx.strokeRect(bx, by, bw, bh);
            ctx.fillStyle = 'rgba(255, 193, 7, 0.9)'; ctx.fillRect(bx, by - 24, Math.max(bw, 160), 24);
            ctx.fillStyle = '#000'; ctx.font = 'bold 12px sans-serif'; ctx.fillText('Wajah Belum Terdaftar', bx + 6, by - 7);
        }
        if (pill) pill.innerHTML = '<i class="bi bi-exclamation-triangle-fill text-warning me-1"></i> Belum ada data wajah guru/staf terdaftar';
        const card = $('#hasilWajah');
        if (card) {
            card.innerHTML = `
                <div class="d-flex align-items-center justify-content-between">
                    <div>
                        <div class="fw-bold small text-warning">Wajah Terdeteksi (Belum Terdaftar)</div>
                        <div class="text-muted" style="font-size:0.75rem;">Daftarkan wajah ini agar dapat langsung presensi</div>
                    </div>
                    <button type="button" class="btn btn-sm btn-outline-primary" data-act="bukaDaftarWajahKiosk">
                        <i class="bi bi-person-plus me-1"></i> Daftarkan
                    </button>
                </div>`;
        }
        if (K.faceLoopActive) setTimeout(loopScanWajah, 120);
        return;
    }
    
    const match = K.faceMatcher.findBestMatch(detection.descriptor);
    
    if (match.label !== 'unknown') {
        const peg = K.semua.find(p => p.id === Number(match.label));
        const confidence = Math.max(50, Math.min(99, Math.round((1 - (match.distance / 0.52)) * 50 + 50)));
        
        if (target) { target.classList.add('matched'); target.classList.remove('detecting'); }
        if (ctx) {
            ctx.strokeStyle = '#28a745'; ctx.lineWidth = 3;
            ctx.strokeRect(bx, by, bw, bh);
            const tagW = Math.max(bw, 170);
            ctx.fillStyle = 'rgba(40, 167, 69, 0.9)'; ctx.fillRect(bx, by - 26, tagW, 26);
            ctx.fillStyle = '#fff'; ctx.font = 'bold 13px sans-serif';
            ctx.fillText(`${peg ? peg.nama : 'Pegawai'} (${confidence}%)`, bx + 6, by - 8);
        }
        if (pill && peg) pill.innerHTML = `<i class="bi bi-check-circle-fill text-success me-1"></i> Dikenali: <strong>${esc(peg.nama)}</strong>`;
        
        if (peg) {
            if (K.lastMatch.id === peg.id) {
                K.lastMatch.count++;
            } else {
                K.lastMatch = { id: peg.id, count: 1, ts: Date.now() };
            }
            
            const rec = await statusHariIni(peg.id);
            let aksiOtomatis = 'masuk';
            let bolehPresensi = true;
            let statusBadge = '<span class="badge bg-success-subtle text-success">Siap Masuk</span>';
            let statusKet = 'Siap melakukan Presensi Masuk';
            
            if (rec && (rec.status === 'izin' || rec.status === 'sakit')) {
                statusKet = `Tercatat ${STATUS_LABEL[rec.status]} hari ini (disetujui).`;
                statusBadge = `<span class="badge bg-info-subtle text-info">${STATUS_LABEL[rec.status]}</span>`;
                bolehPresensi = false;
            } else if (rec && rec.jam_pulang) {
                statusKet = `Sudah presensi masuk (${rec.jam_masuk}) & pulang (${rec.jam_pulang}) hari ini.`;
                statusBadge = `<span class="badge bg-secondary-subtle text-secondary">Selesai Hari Ini</span>`;
                bolehPresensi = false;
            } else if (rec && rec.jam_masuk) {
                statusKet = `Sudah presensi masuk (${rec.jam_masuk}). Siap Presensi Pulang.`;
                statusBadge = `<span class="badge bg-primary-subtle text-primary">Siap Pulang</span>`;
                aksiOtomatis = 'pulang';
            }
            
            const aksiFinal = K.faceAksiMode === 'auto' ? aksiOtomatis : K.faceAksiMode;
            
            const card = $('#hasilWajah');
            if (card) {
                card.innerHTML = `
                    <div class="d-flex align-items-center justify-content-between">
                        <div class="d-flex align-items-center gap-2">
                            ${peg.face_photo ? `<img src="${peg.face_photo}" class="face-avatar">` : `<div class="face-avatar-placeholder">${esc(peg.nama[0])}</div>`}
                            <div>
                                <div class="fw-bold small text-dark">${esc(peg.nama)} <span class="badge bg-success-subtle text-success ms-1">${confidence}%</span></div>
                                <div class="text-muted" style="font-size:0.75rem;">${statusKet}</div>
                            </div>
                        </div>
                        <div>
                            ${bolehPresensi ? `<button type="button" class="btn btn-sm ${aksiFinal === 'pulang' ? 'btn-info' : 'btn-success'} fw-semibold px-3" data-act="klikAbsenWajah" data-pid="${peg.id}" data-aksi="${aksiFinal}">
                                <i class="bi ${aksiFinal === 'pulang' ? 'bi-box-arrow-right' : 'bi-box-arrow-in-right'} me-1"></i> ${aksiFinal === 'pulang' ? 'Presensi Pulang' : 'Presensi Masuk'}
                            </button>` : statusBadge}
                        </div>
                    </div>`;
            }
            
            // Auto-trigger presensi jika stabil minimal 2 siklus (~0.8 detik)
            if (bolehPresensi && K.lastMatch.count >= 2) {
                prosesPresensiWajah(peg, aksiFinal, v);
                return;
            }
        }
    } else {
        // Unknown face
        if (target) { target.classList.add('detecting'); target.classList.remove('matched'); }
        if (ctx) {
            ctx.strokeStyle = '#fd7e14'; ctx.lineWidth = 2; ctx.strokeRect(bx, by, bw, bh);
            ctx.fillStyle = 'rgba(253, 126, 20, 0.9)'; ctx.fillRect(bx, by - 24, Math.max(bw, 160), 24);
            ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.fillText('Wajah Tidak Dikenali', bx + 6, by - 7);
        }
        if (pill) pill.innerHTML = '<i class="bi bi-question-circle-fill text-warning me-1"></i> Wajah belum terdaftar di sistem';
        const card = $('#hasilWajah');
        if (card) {
            card.innerHTML = `
                <div class="d-flex align-items-center justify-content-between">
                    <div>
                        <div class="fw-bold small text-warning">Wajah Tidak Dikenali</div>
                        <div class="text-muted" style="font-size:0.75rem;">Pastikan wajah sudah didaftarkan di sistem atau gunakan presensi PIN</div>
                    </div>
                    <button type="button" class="btn btn-sm btn-outline-primary" data-act="bukaDaftarWajahKiosk">
                        <i class="bi bi-person-plus me-1"></i> Daftarkan Wajah
                    </button>
                </div>`;
        }
        K.lastMatch = { id: null, count: 0, ts: 0 };
    }
    
    if (K.faceLoopActive && !K.isProcessingPresensi) setTimeout(loopScanWajah, 80);
}

async function prosesPresensiWajah(peg, aksi, videoEl) {
    if (K.isProcessingPresensi) return;
    K.isProcessingPresensi = true;
    
    const statusPill = $('#statusWajah');
    const targetBox = $('#targetWajah');
    const cardHasil = $('#hasilWajah');
    
    if (statusPill) statusPill.innerHTML = `<div class="spinner-border spinner-border-sm text-light me-1" style="width:0.85rem;height:0.85rem;"></div> Memproses presensi <strong>${esc(peg.nama)}</strong>...`;
    if (targetBox) targetBox.classList.add('matched');
    
    const fotoBukti = buatFotoGeotag(videoEl, peg, aksi);
    const res = await catatPresensi(peg.id, peg.pin, aksi, fotoBukti, true);
    
    if (res.ok) {
        bunyikanSukses();
        if (cardHasil) {
            cardHasil.className = 'face-card-result sukses animate__animated animate__fadeIn';
            cardHasil.innerHTML = `
                <div class="text-center py-2">
                    <div class="d-inline-flex align-items-center justify-content-center bg-success text-white rounded-circle mb-2" style="width:48px;height:48px;">
                        <i class="bi bi-check-lg fs-2"></i>
                    </div>
                    <h5 class="fw-bold mb-1 text-success">Presensi ${aksi === 'pulang' ? 'Pulang' : 'Masuk'} Berhasil!</h5>
                    <div class="fw-bold text-dark fs-5">${esc(peg.nama)}</div>
                    <div class="text-muted small mt-1">Pukul ${res.jam} WIB · ${res.status === 'terlambat' ? '<span class="text-warning fw-semibold">Terlambat</span>' : '<span class="text-success fw-semibold">Tepat Waktu</span>'} · Metode Wajah</div>
                    <div class="mt-2"><span class="badge bg-light text-muted border" id="countdownReset">Melanjutkan dalam 3 detik...</span></div>
                </div>`;
        }
        if (statusPill) statusPill.innerHTML = `<i class="bi bi-check-circle-fill text-success me-1"></i> Sukses: ${esc(peg.nama)}`;
        
        let sisa = 3;
        const cdTimer = setInterval(() => {
            sisa--;
            const el = $('#countdownReset');
            if (el) el.textContent = `Melanjutkan dalam ${sisa} detik...`;
            if (sisa <= 0) {
                clearInterval(cdTimer);
                K.isProcessingPresensi = false;
                K.lastMatch = { id: null, count: 0, ts: 0 };
                resetCardHasilWajah();
                if (K.faceLoopActive) loopScanWajah();
            }
        }, 1000);
    } else {
        if (cardHasil) {
            cardHasil.className = 'face-card-result animate__animated animate__shakeX';
            cardHasil.innerHTML = `
                <div class="d-flex align-items-center gap-2 text-danger">
                    <i class="bi bi-exclamation-octagon-fill fs-3"></i>
                    <div>
                        <div class="fw-bold">Presensi Ditolak</div>
                        <div class="small">${esc(res.pesan)}</div>
                    </div>
                </div>`;
        }
        if (statusPill) statusPill.innerHTML = `<i class="bi bi-x-circle-fill text-danger me-1"></i> ${esc(res.pesan)}`;
        
        setTimeout(() => {
            K.isProcessingPresensi = false;
            K.lastMatch = { id: null, count: 0, ts: 0 };
            resetCardHasilWajah();
            if (K.faceLoopActive) loopScanWajah();
        }, 3000);
    }
}

    const pegList = K.semua;
    tampilModal('Daftarkan Wajah Pegawai', `

        </div>
        <div class="mt-3 text-end d-flex gap-2 justify-content-end">

            <button type="button" class="btn btn-primary btn-sm" id="btnSimpanWajah" disabled>
                <i class="bi bi-camera-fill me-1"></i> Ambil &amp; Simpan Wajah
            </button>
        </div>
    `, { ok: false, lebar: 'modal-md' });

    let stream = null;
    let regLoop = true;
    let latestDetection = null;

    try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });

        const v = $('#videoRegWajah');
        const c = $('#canvasRegWajah');
        const info = $('#statusDeteksiReg');
        const btn = $('#btnSimpanWajah');
        if (v && v.readyState >= 2 && v.videoWidth) {
            if (c && (c.width !== v.clientWidth || c.height !== v.clientHeight)) {
                c.width = v.clientWidth; c.height = v.clientHeight;
            }
            const detection = await FaceRec.detectSingle(v);
            if (c) {
                const ctx = c.getContext('2d');
                ctx.clearRect(0, 0, c.width, c.height);
                if (detection) {
                    latestDetection = detection;
                    const scaleX = c.width / v.videoWidth, scaleY = c.height / v.videoHeight;
                    const box = detection.detection.box;
                    const bw = box.width * scaleX, bh = box.height * scaleY;
                    const bx = c.width - (box.x * scaleX + bw), by = box.y * scaleY;
                    ctx.strokeStyle = '#28a745'; ctx.lineWidth = 3;
                    ctx.strokeRect(bx, by, bw, bh);
                    if (info) {
                        info.className = 'alert alert-success small py-2 mb-0 text-center';
                        info.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i> Wajah terdeteksi dengan baik. Siap diambil!';
                    }
                    if (btn) btn.disabled = false;
                } else {
                    latestDetection = null;
                    if (info) {
                        info.className = 'alert alert-secondary small py-2 mb-0 text-center';
                        info.innerHTML = '<i class="bi bi-camera me-1"></i> Posisikan wajah di tengah bingkai...';
                    }
                    if (btn) btn.disabled = true;
                }
            }
        }
        if (regLoop) setTimeout(loopReg, 150);
    };
    loopReg();

    $('#btnSimpanWajah').addEventListener('click', async () => {
        const pid = Number($('#daftarWajahPegawaiId').value);
        const pin = ($('#daftarWajahPin').value || '').trim();
        if (!pid) { alert('Pilih guru atau staf.'); return; }
        const p = await DB.get('pegawai', pid);
        if (!p) { alert('Data pegawai tidak ditemukan.'); return; }
        if (p.pin !== pin) { alert('PIN salah. Verifikasi gagal.'); return; }
        if (!latestDetection) { alert('Wajah belum terdeteksi. Lihat ke kamera.'); return; }

        const v = $('#videoRegWajah');
        const sc = document.createElement('canvas');
        sc.width = 160; sc.height = 160;
        const sctx = sc.getContext('2d');
        sctx.translate(160, 0); sctx.scale(-1, 1);
        sctx.drawImage(v, 0, 0, 160, 160);
        const fotoThumbnail = sc.toDataURL('image/jpeg', 0.85);

        p.face_descriptor = Array.from(latestDetection.descriptor);
        p.face_photo = fotoThumbnail;
        await DB.put('pegawai', p);

        const idx = K.semua.findIndex(x => x.id === p.id);
        if (idx !== -1) K.semua[idx] = p;
        K.faceMatcher = FaceRec.buildMatcher(K.semua);

        bootstrap.Modal.getInstance(modalEl).hide();
        flash(`Wajah '${p.nama}' berhasil didaftarkan! Sekarang dapat langsung absen dengan wajah.`, 'success');
        render();
    });
}

        }
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 960 }, height: { ideal: 720 } }, audio: false })

    },

    ambilFoto() {
        const v = $('#kameraVideo');
        if (!v.videoWidth) { errKamera('Kamera belum siap, tunggu sebentar.'); return; }
        const skala = Math.min(1, 960 / v.videoWidth), c = document.createElement('canvas');
        c.width = Math.round(v.videoWidth * skala); c.height = Math.round(v.videoHeight * skala);
        const ctx = c.getContext('2d'); ctx.drawImage(v, 0, 0, c.width, c.height);
        const u = Math.max(13, Math.round(c.width / 48)), pad = Math.round(u * 0.6);
        ctx.font = `600 ${u}px Arial, sans-serif`;
        const baris = bungkus(ctx, teksGeotag(), c.width - pad * 2);
        if (K.alamat) bungkus(ctx, K.alamat, c.width - pad * 2).slice(0, 2).forEach(b => baris.push(b));
        const tinggi = baris.length * u * 1.3 + pad * 2;
        ctx.fillStyle = 'rgba(0,0,0,0.62)'; ctx.fillRect(0, c.height - tinggi, c.width, tinggi);
        ctx.fillStyle = '#fff'; ctx.textBaseline = 'top';
        baris.forEach((b, i) => ctx.fillText(b, pad, c.height - tinggi + pad + i * u * 1.3));

            $('#sekolahLat').value = pos.coords.latitude.toFixed(6); $('#sekolahLng').value = pos.coords.longitude.toFixed(6);
        }, () => alert('Gagal mengambil lokasi. Pastikan izin lokasi diaktifkan.'), { enableHighAccuracy: true, timeout: 10000 });
    }
};

async function catatPresensi(pid, pin, aksi, foto, viaWajah = false) {
    const p = await DB.get('pegawai', pid);
    if (!p || p.status !== 'aktif') return { ok: false, pesan: 'Data pegawai tidak ditemukan.', kat: 'danger' };
    if (!viaWajah && pin !== p.pin) return { ok: false, pesan: 'PIN salah. Silakan coba lagi.', kat: 'danger' };
    const set = await DB.pengaturan();
    const radius = Number(set.radius_meter || 0);
    if (radius > 0 && set.sekolah_lat && set.sekolah_lng) {
        if (K.lat === null) return { ok: false, pesan: 'Lokasi tidak terdeteksi. Aktifkan izin lokasi lalu coba lagi.', kat: 'danger' };
        const j = jarakMeter(K.lat, K.lng, Number(set.sekolah_lat), Number(set.sekolah_lng));
        if (j > radius) return { ok: false, pesan: `Presensi ditolak: Anda sekitar ${Math.round(j)} m dari sekolah (maks ${Math.round(radius)} m).`, kat: 'danger' };
    }
    const now = new Date(), jam = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0'), tgl = isoTgl(now);
    const lokasi = K.alamat || (K.lat !== null ? `${K.lat.toFixed(5)}, ${K.lng.toFixed(5)}` : null);
    let rec = (await DB.all('presensi')).find(r => r.pegawai_id === pid && r.tanggal === tgl);
    if (rec && (rec.status === 'izin' || rec.status === 'sakit')) {
        return { ok: false, pesan: `${p.nama} tercatat ${STATUS_LABEL[rec.status]} hari ini (izin disetujui), tidak perlu presensi.`, kat: 'warning' };
    }

    if (aksi === 'masuk') {
        if (rec && rec.jam_masuk) return { ok: false, pesan: `${p.nama} sudah presensi masuk hari ini pukul ${rec.jam_masuk}.`, kat: 'warning' };
        const status = (now.getHours() * 60 + now.getMinutes()) <= batasTerlambat(set.jam_masuk_standar, set.toleransi_menit) ? 'hadir' : 'terlambat';
        rec = Object.assign(rec || { pegawai_id: pid, tanggal: tgl }, { jam_masuk: jam, lokasi_masuk: lokasi, lat_masuk: K.lat, lng_masuk: K.lng, foto_masuk: foto, status, waktu_catat: nowStr(), metode: viaWajah ? 'wajah' : 'pin' });
        await DB.put('presensi', rec);
        return { ok: true, pesan: `Presensi Masuk berhasil, ${p.nama} — pukul ${jam} (${status === 'terlambat' ? 'Terlambat' : 'Tepat Waktu'}).`, kat: status === 'terlambat' ? 'warning' : 'success', status, pegawai: p, jam };
    }
    if (aksi === 'pulang') {
        if (!rec || !rec.jam_masuk) return { ok: false, pesan: `${p.nama} belum presensi masuk, belum bisa presensi pulang.`, kat: 'danger' };
        if (rec.jam_pulang) return { ok: false, pesan: `${p.nama} sudah presensi pulang hari ini pukul ${rec.jam_pulang}.`, kat: 'warning' };
        Object.assign(rec, { jam_pulang: jam, lokasi_pulang: lokasi, lat_pulang: K.lat, lng_pulang: K.lng, foto_pulang: foto, metode_pulang: viaWajah ? 'wajah' : 'pin' });
        await DB.put('presensi', rec);
        return { ok: true, pesan: `Presensi Pulang berhasil, ${p.nama} — pukul ${jam}. Sampai jumpa!`, kat: 'success', pegawai: p, jam };
    }
    return { ok: false, pesan: 'Aksi tidak dikenali.', kat: 'danger' };
}

async function ajukanIzin(pid, pin, jenis, mulai, selesai, alasan) {
    const p = await DB.get('pegawai', pid);
    if (!p || p.status !== 'aktif') return kembaliKiosk('Data pegawai tidak ditemukan.', 'danger');
    if (pin !== p.pin) return kembaliKiosk('PIN salah. Pengajuan tidak dikirim.', 'danger');
    const dm = parseTgl(mulai), ds = parseTgl(selesai), t0 = parseTgl(hariIni());
    if (dm < new Date(t0.getTime() - 7 * 864e5)) return kembaliKiosk('Tanggal mulai tidak boleh lebih dari 7 hari yang lalu.', 'danger');
    if ((ds - dm) / 864e5 > 30) return kembaliKiosk('Rentang pengajuan maksimal 31 hari.', 'danger');
    const tabrakan = (await DB.all('perizinan')).some(z => z.pegawai_id === pid && ['menunggu', 'disetujui'].includes(z.status) && z.tanggal_mulai <= selesai && z.tanggal_selesai >= mulai);
    if (tabrakan) return kembaliKiosk('Sudah ada pengajuan (menunggu/disetujui) pada rentang tanggal tersebut.', 'warning');
    await DB.put('perizinan', { pegawai_id: pid, jenis, tanggal_mulai: mulai, tanggal_selesai: selesai, alasan, status: 'menunggu', diajukan_pada: nowStr() });
    kembaliKiosk(`Pengajuan ${STATUS_LABEL[jenis]} atas nama ${p.nama} terkirim dan menunggu persetujuan Kepala Sekolah.`, 'success');
}

async function putuskanIzin(id, keputusan, catatan) {
    const z = await DB.get('perizinan', id);
    if (!z || z.status !== 'menunggu') { flash('Pengajuan ini sudah diputuskan sebelumnya.', 'warning'); return render(); }
    z.status = keputusan === 'setuju' ? 'disetujui' : 'ditolak';
    z.diputuskan_oleh = Sesi.get().nama; z.diputuskan_pada = nowStr(); z.catatan_keputusan = catatan;
    await DB.put('perizinan', z);
    let pesan = `Pengajuan ${z.status}.`;
    if (z.status === 'disetujui') pesan += ` ${await terapkanPerizinan(z)} hari kerja dicatat ke presensi.`;
    flash(pesan, z.status === 'disetujui' ? 'success' : 'warning'); render();
}
async function terapkanPerizinan(z) {
    const semua = await DB.all('presensi'); let n = 0;
    for (let cur = parseTgl(z.tanggal_mulai), akhir = parseTgl(z.tanggal_selesai); cur <= akhir; cur.setDate(cur.getDate() + 1)) {
        if (dowSenin(cur) >= 5) continue;
        const tgl = isoTgl(cur), rec = semua.find(r => r.pegawai_id === z.pegawai_id && r.tanggal === tgl);
        if (rec && rec.jam_masuk) continue;
        await DB.put('presensi', Object.assign(rec || { pegawai_id: z.pegawai_id, tanggal: tgl }, { status: z.jenis, keterangan: z.alasan, waktu_catat: nowStr() }));
        n++;
    }
    return n;
}

// ---------- laporan ----------
function paramLaporan() {
    const h = new Date(); let tahun = parseInt(rutePar.tahun) || h.getFullYear(), bulan = parseInt(rutePar.bulan) || h.getMonth() + 1;
    if (bulan < 1 || bulan > 12 || tahun < 2000 || tahun > 2100) { tahun = h.getFullYear(); bulan = h.getMonth() + 1; }
    return { tahun, bulan, q: (rutePar.q || '').trim(), pid: parseInt(rutePar.pegawai_id) || null };
}
function rekapBulanan(peg, pres, tahun, bulan) {
    const akhirBulan = new Date(tahun, bulan, 0), awal = new Date(tahun, bulan - 1, 1), batas = akhirBulan < new Date() ? akhirBulan : new Date();
    const awalS = isoTgl(awal), akhirS = isoTgl(akhirBulan), tercatat = {};
    pres.filter(r => r.tanggal >= awalS && r.tanggal <= akhirS).forEach(r => tercatat[r.pegawai_id + '|' + r.tanggal] = r.status);
    const hariKerja = [];
    for (let c = new Date(awal); c <= batas; c.setDate(c.getDate() + 1)) if (dowSenin(c) < 5) hariKerja.push(isoTgl(c));
    return peg.filter(p => p.status === 'aktif').sort((a, b) => a.jenis.localeCompare(b.jenis) || a.nama.localeCompare(b.nama)).map(p => {
        const r = { hadir: 0, terlambat: 0, sakit: 0, izin: 0, alpa: 0 }, mulai = (p.created_at || '').slice(0, 10) > awalS ? p.created_at.slice(0, 10) : awalS;
        hariKerja.forEach(t => { if (t < mulai) return; const st = tercatat[p.id + '|' + t]; r[st || 'alpa']++; });
        return Object.assign({ pegawai: p }, r, { total: r.hadir + r.terlambat + r.sakit + r.izin + r.alpa });
    });
}
function filterRekap(h, q, pid) {
    if (pid) h = h.filter(r => r.pegawai.id === pid);
    if (q) { const k = q.toLowerCase(); h = h.filter(r => r.pegawai.nama.toLowerCase().includes(k) || (r.pegawai.nip || '').toLowerCase().includes(k) || kode(r.pegawai).toLowerCase().includes(k)); }
    return h;
}
function rincianHarian(p, pres, tahun, bulan) {
    const akhirBulan = new Date(tahun, bulan, 0), batas = akhirBulan < new Date() ? akhirBulan : new Date(), awalS = isoTgl(new Date(tahun, bulan - 1, 1));
    const ada = Object.fromEntries(pres.filter(r => r.pegawai_id === p.id).map(r => [r.tanggal, r]));
    const mulai = (p.created_at || '').slice(0, 10) > awalS ? p.created_at.slice(0, 10) : awalS, hasil = [];
    for (let c = new Date(tahun, bulan - 1, 1); c <= akhirBulan; c.setDate(c.getDate() + 1)) {
        const t = isoTgl(c), rec = ada[t], hari = NAMA_HARI_MULAI_SENIN[dowSenin(c)];
        if (rec) hasil.push({ tanggal: t, hari, status: rec.status, jam_masuk: rec.jam_masuk, jam_pulang: rec.jam_pulang, lokasi: rec.lokasi_masuk, keterangan: rec.keterangan });
        else if (dowSenin(c) < 5 && t >= mulai && c <= batas) hasil.push({ tanggal: t, hari, status: 'alpa' });
    }
    return hasil;
}

    <form data-form="filter" data-rute="/laporan" class="row g-2 mb-3 align-items-end">

async function unduhLaporanPdf() {
    if (!window.jspdf) { alert('Pustaka PDF belum termuat. Periksa koneksi internet lalu coba lagi.'); return; }
    const { tahun, bulan, q, pid } = paramLaporan(), [peg, pres, set] = await Promise.all([DB.all('pegawai'), DB.all('presensi'), DB.pengaturan()]);
    const hasil = filterRekap(rekapBulanan(peg, pres, tahun, bulan), q, pid), pilih = pid ? peg.find(p => p.id === pid) : null;
    const doc = new jspdf.jsPDF({ unit: 'mm', format: 'a4' }), navy = [27, 58, 92], W = 210;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(85); doc.text(set.nama_sekolah.toUpperCase(), W / 2, 15, { align: 'center' });
    doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.setTextColor(...navy);
    doc.text(pilih ? 'RIWAYAT KEHADIRAN INDIVIDU' : 'REKAP PRESENSI GURU & STAF', W / 2, 23, { align: 'center' });
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(85);
    doc.text(`Bulan ${NAMA_BULAN[bulan]} ${tahun}` + (!pilih && q ? ` - pencarian: "${q}"` : ''), W / 2, 29, { align: 'center' });
    let y = 35;
    const gaya = { headStyles: { fillColor: navy, textColor: 255, fontSize: 8.5 }, styles: { fontSize: 8.5, cellPadding: 1.8, lineColor: [204, 204, 204], lineWidth: 0.1 }, alternateRowStyles: { fillColor: [240, 242, 245] }, margin: { left: 12, right: 12 } };
    if (pilih) {
        doc.setTextColor(0); doc.setFontSize(9.5);
        [['ID', kode(pilih)], ['Nama', pilih.nama], ['NIP', pilih.nip || '-'], ['Jabatan', `${pilih.jabatan || '-'} (${pilih.jenis === 'guru' ? 'Guru' : 'Staf'})`]].forEach(([k, v], i) => { doc.text(k, 12, y + i * 5); doc.text(': ' + v, 32, y + i * 5); });
        y += 24;
        const rinci = rincianHarian(pilih, pres, tahun, bulan);
        if (!rinci.length) { doc.text('Belum ada data kehadiran pada bulan ini.', 12, y); y += 6; }
        else {
            doc.autoTable(Object.assign({ startY: y, head: [['No', 'Tanggal', 'Hari', 'Jam Masuk', 'Jam Pulang', 'Status', 'Keterangan']],
                body: rinci.map((r, i) => [i + 1, parseTgl(r.tanggal).toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric' }), r.hari, r.jam_masuk || '-', r.jam_pulang || '-', STATUS_LABEL[r.status], r.keterangan || '']),
                columnStyles: { 0: { halign: 'center' }, 3: { halign: 'center' }, 4: { halign: 'center' }, 5: { halign: 'center' } } }, gaya));
            y = doc.lastAutoTable.finalY + 6;
            const rg = hasil.find(r => r.pegawai.id === pilih.id);
            if (rg) { doc.setFontSize(9.5); doc.setTextColor(0); doc.text(`Ringkasan: Hadir ${rg.hadir} | Terlambat ${rg.terlambat} | Sakit ${rg.sakit} | Izin ${rg.izin} | Alpa ${rg.alpa}`, 12, y); y += 4; }
        }
    } else if (!hasil.length) { doc.setTextColor(0); doc.text('Tidak ada data pegawai yang sesuai.', 12, y); y += 6; }
    else {
        doc.autoTable(Object.assign({ startY: y, head: [['No', 'ID', 'Nama', 'Jenis', 'Jabatan', 'Hadir', 'Terlambat', 'Sakit', 'Izin', 'Alpa', 'Total']],
            body: hasil.map((r, i) => [i + 1, kode(r.pegawai), r.pegawai.nama, r.pegawai.jenis === 'guru' ? 'Guru' : 'Staf', r.pegawai.jabatan || '-', r.hadir, r.terlambat, r.sakit, r.izin, r.alpa, r.total]),
            columnStyles: { 0: { halign: 'center' }, 3: { halign: 'center' }, 5: { halign: 'center' }, 6: { halign: 'center' }, 7: { halign: 'center' }, 8: { halign: 'center' }, 9: { halign: 'center' }, 10: { halign: 'center' } } }, gaya));
        y = doc.lastAutoTable.finalY + 4;
    }
    // kolom pengesahan
    if (y + 52 > 285) { doc.addPage(); y = 20; }
    y += 8; const n = new Date(), kota = set.kota || '...............', cx1 = 55, cx2 = 155;
    doc.setFontSize(9.5); doc.setTextColor(0); doc.setFont('helvetica', 'normal');

    doc.text('Dibuat oleh,', cx1, y + 5, { align: 'center' }); doc.text('Mengesahkan,', cx2, y + 5, { align: 'center' });
    doc.text('Administrator', cx1, y + 10, { align: 'center' }); doc.text('Kepala Sekolah', cx2, y + 10, { align: 'center' });
    const yt = y + 32, nama = set.nama_kepala_sekolah || '(...........................................)';
    doc.text('(...........................................)', cx1, yt, { align: 'center' });
    doc.text(nama, cx2, yt, { align: 'center' }); doc.line(cx2 - doc.getTextWidth(nama) / 2, yt + 0.8, cx2 + doc.getTextWidth(nama) / 2, yt + 0.8);
    doc.text(set.nip_kepala_sekolah ? `NIP. ${set.nip_kepala_sekolah}` : 'NIP. .............................', cx2, yt + 5, { align: 'center' });

}

    <div class="card-x p-4 mt-4" style="max-width:560px;"><h6 class="fw-bold mb-2"><i class="bi bi-hdd me-1"></i>Cadangan Data</h6>
        <p class="small text-muted">Versi GitHub Pages menyimpan data di browser perangkat ini (tidak otomatis tersinkron ke perangkat lain). Unduh cadangan secara berkala, dan pulihkan bila berpindah perangkat.</p>
        <div class="d-flex gap-2 flex-wrap"><button class="btn btn-outline-secondary btn-sm" data-act="cadangkan"><i class="bi bi-download me-1"></i>Unduh Cadangan</button>
        <button class="btn btn-outline-secondary btn-sm" data-act="pulihkan"><i class="bi bi-upload me-1"></i>Pulihkan dari Cadangan</button>
        <button class="btn btn-outline-danger btn-sm" data-act="resetData"><i class="bi bi-trash me-1"></i>Reset Data</button></div>
        <input type="file" id="fileCadangan" accept="application/json" hidden></div>`;
}
document.addEventListener('change', async ev => {
    if (ev.target.id !== 'fileCadangan' || !ev.target.files[0]) return;
    try {
        const dump = JSON.parse(await ev.target.files[0].text());
        if (!STORES.every(s => Array.isArray(dump[s]))) throw new Error('Format file cadangan tidak dikenali.');
        for (const s of STORES) { await DB.clear(s); for (const o of dump[s]) await DB.put(s, o); }
        Sesi.clear(); flash('Data berhasil dipulihkan. Silakan login kembali.', 'success'); nav('/login');
    } catch (e) { alert('Gagal memulihkan: ' + e.message); }
});

async function halAkun() {
    const users = (await DB.all('users')).sort((a, b) => a.username.localeCompare(b.username));
    return `${head('', 'Kelola Akun')}
    <div class="row g-3"><div class="col-lg-7"><div class="card-x p-3"><table class="table align-middle mb-0"><thead><tr><th>Username</th><th>Nama</th><th>Peran</th><th></th></tr></thead><tbody>
    ${users.map(u => `<tr><td><code>${esc(u.username)}</code></td><td>${esc(u.nama_lengkap)}</td><td>${u.role === 'kepala_sekolah' ? 'Kepala Sekolah' : 'Administrator'}</td>
        <td class="text-end"><button class="btn btn-sm btn-outline-secondary" data-act="resetAkun" data-id="${u.id}" title="Reset password"><i class="bi bi-key"></i></button> <button class="btn btn-sm btn-outline-danger" data-act="hapusAkun" data-id="${u.id}" title="Hapus"><i class="bi bi-trash"></i></button></td></tr>`).join('')}</tbody></table></div></div>
    <div class="col-lg-5"><div class="card-x p-3"><h6 class="fw-bold mb-3">Tambah Akun</h6><form data-form="akunBaru">
        <div class="mb-2"><input name="username" class="form-control" placeholder="Username" required></div><div class="mb-2"><input name="nama_lengkap" class="form-control" placeholder="Nama lengkap" required></div>
        <div class="mb-2"><input type="password" name="password" class="form-control" placeholder="Password (min. 4 karakter)" required></div>
        <div class="mb-3"><select name="role" class="form-select"><option value="admin">Administrator</option><option value="kepala_sekolah">Kepala Sekolah</option></select></div>
        <button class="btn btn-brand w-100">Tambah</button></form></div></div></div>`;
}

// ---------- mulai ----------
(async function init() {
    try {
        if (!window.indexedDB || !window.crypto || !crypto.subtle) throw new Error('Browser tidak mendukung penyimpanan lokal atau memerlukan HTTPS.');
        await DB.open(); await seedAwal(); await render();
    } catch (e) { $('#app').innerHTML = `<div class="page-wrap"><div class="alert alert-danger">${esc(e.message)}</div></div>`; }
})();

</script>
</body>
</html>
